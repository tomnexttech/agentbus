[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agentbus"
version = "0.1.0"
description = "Five small primitives for agents that run unattended: a one-writer bus, atomic JSON state, three-valued answers, a four-lock guard for localhost endpoints that can run code, and timestamps that stay true."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "tomnexttech" }]
keywords = ["agents", "llm", "csrf", "dns-rebinding", "localhost", "atomic-write", "staleness"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/tomnexttech/agentbus"
Source = "https://github.com/tomnexttech/agentbus"
Issues = "https://github.com/tomnexttech/agentbus/issues"

[tool.setuptools.packages.find]
include = ["agentbus*"]
